name: koel

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-koel}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      target: runtime
    image: koel:${KOEL_TAG:-dev}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    ports:
      - "${APP_PORT:-8000}:8000"
    command: ["uvicorn", "koel.api.main:app", "--host", "0.0.0.0", "--port", "8000"]

  worker:
    image: koel:${KOEL_TAG:-dev}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    command: ["celery", "-A", "koel.tasks.celery_app", "worker",
              "--loglevel=info",
              "--queues=scraping,notifications,maintenance,usage"]

  beat:
    image: koel:${KOEL_TAG:-dev}
    restart: unless-stopped
    depends_on:
      - worker
    env_file: .env
    command: ["celery", "-A", "koel.tasks.celery_app", "beat",
              "--loglevel=info"]

volumes:
  postgres_data:
  redis_data:
