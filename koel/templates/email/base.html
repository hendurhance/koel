<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light only" />
    <title>{% block title %}{{ app_name }}{% endblock %}</title>
  </head>
  <body style="margin:0; padding:0; background:#f4f4f0; color:#0b0b0d;
               font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
               -webkit-font-smoothing:antialiased;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
           style="background:#f4f4f0;">
      <tr>
        <td align="center" style="padding:40px 16px;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
                 style="max-width:480px; background:#ffffff; border:1px solid #e5e5e0;">
            <!-- header -->
            <tr>
              <td style="padding:28px 32px 0 32px;">
                <span style="font-family:Georgia,'Times New Roman',serif; font-size:22px;
                             letter-spacing:-0.01em; color:#0b0b0d;">koel</span>
                <span style="display:inline-block; width:8px; height:8px; margin-left:2px;
                             background:#27645f; border-radius:50%;"></span>
              </td>
            </tr>
            <!-- content -->
            <tr>
              <td style="padding:24px 32px 32px 32px;">
                {% block content %}{% endblock %}
              </td>
            </tr>
            <!-- footer -->
            <tr>
              <td style="padding:20px 32px; border-top:1px solid #e5e5e0;">
                <p style="margin:0; font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
                          font-size:11px; line-height:1.6; color:#8a8a85; text-transform:uppercase;
                          letter-spacing:0.08em;">
                  {{ app_name }} &middot; sent automatically &middot; do not reply
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
